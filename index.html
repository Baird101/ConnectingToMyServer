```html
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>WebSocket Test</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }

        #status {
            font-size: 24px;
            margin: 20px;
        }

        #messages {
            width: 500px;
            min-height: 150px;
            margin: 20px auto;
            padding: 10px;
            border: 1px solid #999;
            text-align: left;
            white-space: pre-wrap;
        }

        input {
            padding: 10px;
            width: 300px;
        }

        button {
            padding: 10px 20px;
        }
    </style>
</head>

<body>

    <h1>Relay Server Test</h1>

    <div id="status">Connecting...</div>

    <div id="messages"></div>

    <input id="messageInput" type="text" placeholder="Message">
    <button onclick="sendMessage()">Send</button>

    <script>
        var socket = new WebSocket('ws://78.154.103.44:10402');

        socket.onopen = function() {
            document.getElementById('status').textContent = 'Connected!';

            addMessage('Connected to relay server.');

            socket.send(JSON.stringify({
                type: 'hello',
                name: 'DebugRanger'
            }));
        };

        socket.onmessage = function(event) {
            addMessage('Server: ' + event.data);
        };

        socket.onclose = function() {
            document.getElementById('status').textContent = 'Disconnected';

            addMessage('Disconnected from server.');
        };

        socket.onerror = function(error) {
            document.getElementById('status').textContent = 'Connection error';

            addMessage('WebSocket error.');
            console.log(error);
        };

        function sendMessage() {
            var input = document.getElementById('messageInput');
            var message = input.value;

            if (message === '') {
                return;
            }

            if (socket.readyState !== WebSocket.OPEN) {
                addMessage('Not connected to server.');
                return;
            }

            socket.send(JSON.stringify({
                type: 'chat_send',
                room: 'main',
                name: 'DebugRanger',
                text: message
            }));

            addMessage('You: ' + message);

            input.value = '';
        }

        function addMessage(message) {
            var messages = document.getElementById('messages');

            messages.textContent += message + '\n';
        }
    </script>

</body>
</html>
```
