<!DOCTYPE html>
<html>
<head>
    <title>Relay</title>
    <style>
        .p {
            font-weight: bold;
        }
        #warn {
            font-weight: bold;
            color: red;
            font-size: 30px;
        }
        
        #info {
            color: black;
            font-size: 20px;
        }
    </style>
</head>

<body>
<p id="warn">Please leave this window open!</p>
<p id="info">It's what makes this work for multiplayer</p>
<script>
var socket = null;

var SERVER = "wss://strange-contain-page-discovery.trycloudflare.com";

function connect() {
    socket = new WebSocket(SERVER);

    socket.onopen = function() {
        console.log("SERVER CONNECTED");

        window.opener.postMessage({
            type: "relay_connected"
        }, "*");
    };

    socket.onmessage = function(event) {
        console.log("SERVER:", event.data);

        window.opener.postMessage({
            type: "server_message",
            data: event.data
        }, "*");
    };

    socket.onerror = function(error) {
        console.log("SERVER ERROR");

        window.opener.postMessage({
            type: "relay_error"
        }, "*");
    };

    socket.onclose = function() {
        console.log("SERVER CLOSED");

        window.opener.postMessage({
            type: "relay_closed"
        }, "*");
    };
}

window.addEventListener("message", function(event) {
    if (event.source !== window.opener) {
        return;
    }

    if (event.data.type === "send") {
        if (socket && socket.readyState === WebSocket.OPEN) {
            socket.send(event.data.data);
        }
    }
});

connect();
</script>

</body>
</html>
