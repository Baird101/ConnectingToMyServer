
<!DOCTYPE html>
<html>
<head>
    <title>WebSocket Test</title>
</head>

<body>
    <h1>WebSocket Test</h1>

    <p id="status">Connecting...</p>

    <button onclick="test()">Test Connection</button>

    <pre id="output"></pre>

    <script>
        var status = document.getElementById('status');
        var output = document.getElementById('output');

        var socket = new WebSocket('wss://tester.wispbyte.org');

        socket.onopen = function() {
            status.textContent = 'CONNECTED';
            output.textContent += 'WebSocket connected!\n';

            socket.send('Hello from GitHub Pages!');
        };

        socket.onmessage = function(event) {
            output.textContent += 'Server: ' + event.data + '\n';
        };

        socket.onerror = function(event) {
            status.textContent = 'ERROR';
            output.textContent += 'WebSocket error\n';

            console.log('WebSocket error:', event);
        };

        socket.onclose = function(event) {
            status.textContent = 'CLOSED';
            output.textContent += 'Closed. Code: ' + event.code + '\n';

            console.log('Close event:', event);
        };

        function test() {
            output.textContent += 'Ready state: ' + socket.readyState + '\n';

            if (socket.readyState === WebSocket.OPEN) {
                socket.send('Button test');
            }
        }
    </script>
</body>
</html>
