<!DOCTYPE html>
<html>
<head>
    <title>Counter Test</title>
</head>

<body>

<h1>Server Counter: <span id="counter">?</span></h1>

<button id="increase">Increase Counter</button>

<script>

var testSocket = new WebSocket("ws://217.154.36.84:6404");

testSocket.onopen = function() {
    console.log("CONNECTED!");
};

testSocket.onmessage = function(event) {

};

};

};
